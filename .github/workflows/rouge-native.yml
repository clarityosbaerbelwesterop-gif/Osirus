name: Rouge native

# Native Rouge v1 (training/rouge/native). Unit tests on every push to a
# rouge/native-model-* branch. On dispatch:
# - probe: read-only check of the Lightning AI key; optionally a 15-minute
#   test job within the free credits (CPU, T4 or L4);
# - data: build the tournament corpus on a runner (Hugging Face reachable)
#   and commit its tokenizer and manifest (hashes only, no data);
# - tournament: one level of the pre-registered Architecture v1 tournament
#   as a Lightning job (free credits only, T4/L4), scored by the
#   pre-registered Pareto rule; runs, decision and ledger are committed.
# The Lightning key reaches only the launcher process; jobs get no secrets.
# No weights leave the job machine.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - "training/rouge/native/**"
      - "training/rouge/tests/test_native*"
      - "training/rouge/lightning_ai/job.py"
      - "training/rouge/lightning_ai/*.sh"
      - ".github/workflows/rouge-native.yml"
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [probe, data, tournament]
        default: probe
      submit_test:
        description: "probe: also run a 15-minute test job (free credits)"
        type: choice
        options: [none, CPU, T4, L4]
        default: none
      level:
        description: "tournament level (B: all candidates, size s, 1 seed; C: finalists, size m, 3 seeds)"
        type: choice
        options: [B, C]
        default: B
      r1_29b:
        description: "R1.29b outcome (candidate C: ternary on pass, int8 control on fail)"
        type: choice
        options: [pass, fail]
        default: pass
      finalists:
        description: "level C: comma-separated finalists from the level B decision"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # one Lightning launcher at a time (the credit ledger is a file in this branch)
  group: rouge-native-${{ github.event_name == 'push' && github.sha || (inputs.task == 'data' && 'data' || 'lightning') }}
  cancel-in-progress: false

env:
  ROUGE: training/rouge

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install numpy tokenizers
      - name: Native model, trainer, data and tournament tests
        working-directory: training/rouge
        run: python -m unittest discover -s tests -p "test_native*.py" -v

  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Lightning access (read-only unless a test job is requested)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          SUBMIT_TEST: ${{ inputs.submit_test }}
        run: |
          if [ "$SUBMIT_TEST" = "none" ]; then
            python "$ROUGE/lightning_ai/job.py" probe
          else
            python "$ROUGE/lightning_ai/job.py" probe --submit-test "$SUBMIT_TEST"
          fi
      - name: Commit the credit ledger
        if: ${{ always() && inputs.submit_test != 'none' && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/ledger.json" "$ROUGE/lightning_ai/ledger.json"
            git add "$ROUGE/lightning_ai/ledger.json"
            git diff --cached --quiet && break
            git commit -q -m "rouge(lightning): ledger after probe (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'data' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy tokenizers datasets huggingface_hub
      - name: Build the tournament corpus (tokenizer trained here, then frozen by hash)
        working-directory: training/rouge
        run: |
          tokens="$(python -c "import json; print(json.load(open('configs/native/tournament-v1.json'))['data']['tokens'])")"
          vocab="$(python -c "import json; print(json.load(open('configs/native/tournament-v1.json'))['data']['vocab'])")"
          python -m native.data.build --out "$RUNNER_TEMP/data" --tokens "$tokens" --vocab "$vocab"
          python - <<'PY'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "data", "manifest.json")))
          print("| source | docs train | docs val | train tokens | dropped | contaminated |")
          print("|---|---|---|---|---|---|")
          for n, s in m["sources"].items():
              print(f"| {n} | {s['docs_train']} | {s['docs_val']} | {s['shards']['train']['tokens']} | {s['dropped']} | {s['contaminated_dropped']} |")
          PY
      - name: Rebuild check (a second build must reproduce every shard hash)
        working-directory: training/rouge
        run: |
          python -m native.data.build --out "$RUNNER_TEMP/data2" --tokenizer "$RUNNER_TEMP/data/tokenizer.json" \
            --expect "$RUNNER_TEMP/data/manifest.json"
      - name: Commit tokenizer and manifest (hashes, counts, licences; no data)
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            mkdir -p "$ROUGE/configs/native/data-v1"
            cp "$RUNNER_TEMP/data/tokenizer.json" "$RUNNER_TEMP/data/manifest.json" "$ROUGE/configs/native/data-v1/"
            git add "$ROUGE/configs/native/data-v1"
            git diff --cached --quiet && break
            git commit -q -m "rouge(data): tournament corpus v1 tokenizer and manifest (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  tournament:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'tournament' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Run the level on Lightning (free credits)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          LEVEL: ${{ inputs.level }}
          R1_29B: ${{ inputs.r1_29b }}
          FINALISTS: ${{ inputs.finalists }}
        run: |
          test -f "$ROUGE/configs/native/data-v1/manifest.json" || { echo "run task=data first"; exit 1; }
          if [ "$LEVEL" = "C" ] && [ -z "$FINALISTS" ]; then echo "level C needs finalists"; exit 1; fi
          read -r machine hours < <(python -c "import json; l=json.load(open('$ROUGE/configs/native/tournament-v1.json'))['levels']['$LEVEL']; print(l['machine'], l['max_hours'])")
          python "$ROUGE/lightning_ai/job.py" run --name "rouge-tournament-$LEVEL-${{ github.run_id }}" \
            --machine "$machine" --max-hours "$hours" --script lightning_ai/tournament.sh \
            --env "LEVEL=$LEVEL" --env "R1_29B=$R1_29B" --env "FINALISTS=$FINALISTS" \
            --results "$RUNNER_TEMP/runs.jsonl"
      - name: Score by the pre-registered rule
        if: ${{ always() }}
        working-directory: training/rouge
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          touch "$RUNNER_TEMP/runs.jsonl"
          if [ "$LEVEL" = "C" ] && [ -f results/tournament-v1/level-B/runs.jsonl ]; then
            cat results/tournament-v1/level-B/runs.jsonl "$RUNNER_TEMP/runs.jsonl" > "$RUNNER_TEMP/all.jsonl"
          else
            cp "$RUNNER_TEMP/runs.jsonl" "$RUNNER_TEMP/all.jsonl"
          fi
          python -m native.pareto --tournament configs/native/tournament-v1.json --runs "$RUNNER_TEMP/all.jsonl" \
            --level "$LEVEL" --out "$RUNNER_TEMP/decision.json" | tee "$RUNNER_TEMP/decision.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit runs, decision and ledger
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          LEVEL: ${{ inputs.level }}
        run: |
          cp "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          dest="$ROUGE/results/tournament-v1/level-$LEVEL"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/ledger.json" "$ROUGE/lightning_ai/ledger.json"
            mkdir -p "$dest"
            if [ -s "$RUNNER_TEMP/runs.jsonl" ]; then
              cp "$RUNNER_TEMP/runs.jsonl" "$dest/runs.jsonl"
              cp "$RUNNER_TEMP/decision.json" "$RUNNER_TEMP/decision.md" "$dest/" 2>/dev/null || true
            fi
            git add "$ROUGE/lightning_ai/ledger.json" "$dest"
            git diff --cached --quiet && break
            git commit -q -m "rouge(tournament): level $LEVEL runs and decision (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done
