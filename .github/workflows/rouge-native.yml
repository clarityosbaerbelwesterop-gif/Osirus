name: Rouge native

# Native Rouge v1 (training/rouge/native). Unit tests on every push to a
# rouge/native-model-* branch. On dispatch:
# - probe: read-only check of the Lightning AI key; optionally a 15-minute
#   test job within the free credits (CPU, T4 or L4);
# - data: build the tournament corpus on a runner (Hugging Face reachable)
#   and commit its tokenizer and manifest (hashes only, no data);
# - dryrun-cpu / dryrun-gpu: the whole pipeline end to end on a runner CPU
#   or a Lightning L4 (bf16); the summary is committed as readiness evidence;
# - ready: the 16-condition TRAINING_READY gate with the full test suite;
# - tournament-cpu: Level B-cpu (free fallback, one runner per candidate,
#   exit 75 + "Re-run failed jobs" resumes from the cached checkpoint);
# - tournament: one level of the pre-registered Architecture v1 tournament
#   as a Lightning job (free credits only, T4/L4), scored by the
#   pre-registered Pareto rule; runs, decision and ledger are committed.
# The Lightning key reaches only the launcher process; jobs get no secrets.
# No weights leave the job machine.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - "training/rouge/native/**"
      - "training/rouge/tests/test_native*"
      - "training/rouge/lightning_ai/job.py"
      - "training/rouge/lightning_ai/*.sh"
      - ".github/workflows/rouge-native.yml"
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [probe, data, tournament, tournament-cpu, dryrun-cpu, dryrun-gpu, ready]
        default: probe
      submit_test:
        description: "probe: also run a 15-minute test job (free credits)"
        type: choice
        options: [none, CPU, T4, L4]
        default: none
      level:
        description: "tournament level (B: all candidates, size s, 1 seed; C: finalists, size m, 3 seeds)"
        type: choice
        options: [B, C]
        default: B
      r1_29b:
        description: "R1.29b outcome (candidate C: ternary on pass, int8 control on fail)"
        type: choice
        options: [pass, fail]
        default: pass
      finalists:
        description: "level C: comma-separated finalists from the level B decision"
        type: string
        default: ""
      machine:
        description: "dryrun-gpu: Lightning machine (free credits: T4 or L4)"
        type: choice
        options: [T4, L4]
        default: T4

permissions:
  contents: read

concurrency:
  # one Lightning launcher at a time (the credit ledger is a file in this branch)
  # tournament levels share one lock (credit checks); probes and dry runs are small and merge their ledger entries
  group: rouge-native-${{ github.event_name == 'push' && github.sha || (inputs.task == 'tournament' && 'lightning' || format('{0}-{1}', inputs.task, github.run_id)) }}
  cancel-in-progress: false

env:
  ROUGE: training/rouge

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install numpy tokenizers
      - name: Native model, trainer, data and tournament tests
        working-directory: training/rouge
        run: python -m unittest discover -s tests -p "test_native*.py" -v

  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Lightning access (read-only unless a test job is requested)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          SUBMIT_TEST: ${{ inputs.submit_test }}
        run: |
          if [ "$SUBMIT_TEST" = "none" ]; then
            python "$ROUGE/lightning_ai/job.py" probe --storage --out "$RUNNER_TEMP/probe.json"
          else
            python "$ROUGE/lightning_ai/job.py" probe --storage --out "$RUNNER_TEMP/probe.json" --submit-test "$SUBMIT_TEST"
          fi
      - name: Commit the credit ledger and the probe summary
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
            if [ -f "$RUNNER_TEMP/probe.json" ]; then mkdir -p "$ROUGE/results/lightning" && cp "$RUNNER_TEMP/probe.json" "$ROUGE/results/lightning/probe.json"; fi
            if [ -f "$RUNNER_TEMP/machines.json" ]; then cp "$RUNNER_TEMP/machines.json" "$ROUGE/results/lightning/machines.json"; fi
            git add "$ROUGE/lightning_ai/ledger.json" "$ROUGE/results/lightning" 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "rouge(lightning): ledger and probe summary (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'data' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy tokenizers datasets huggingface_hub
      - name: Build the tournament corpus (tokenizer trained here, then frozen by hash)
        working-directory: training/rouge
        run: |
          tokens="$(python -c "import json; print(json.load(open('configs/native/tournament-v1.json'))['data']['tokens'])")"
          vocab="$(python -c "import json; print(json.load(open('configs/native/tournament-v1.json'))['data']['vocab'])")"
          python -m native.data.build --out "$RUNNER_TEMP/data" --tokens "$tokens" --vocab "$vocab"
          python - <<'PY'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "data", "manifest.json")))
          print("| source | docs train | docs val | train tokens | dropped | contaminated |")
          print("|---|---|---|---|---|---|")
          for n, s in m["sources"].items():
              print(f"| {n} | {s['docs_train']} | {s['docs_val']} | {s['shards']['train']['tokens']} | {s['dropped']} | {s['contaminated_dropped']} |")
          PY
      - name: Rebuild check (a second build must reproduce every shard hash)
        working-directory: training/rouge
        run: |
          python -m native.data.build --out "$RUNNER_TEMP/data2" --tokenizer "$RUNNER_TEMP/data/tokenizer.json" \
            --expect "$RUNNER_TEMP/data/manifest.json"
      - name: Commit tokenizer and manifest (hashes, counts, licences; no data)
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            mkdir -p "$ROUGE/configs/native/data-v1"
            cp "$RUNNER_TEMP/data/tokenizer.json" "$RUNNER_TEMP/data/manifest.json" "$ROUGE/configs/native/data-v1/"
            git add "$ROUGE/configs/native/data-v1"
            git diff --cached --quiet && break
            git commit -q -m "rouge(data): tournament corpus v1 tokenizer and manifest (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  tournament:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'tournament' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Run the level on Lightning (free credits)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          LEVEL: ${{ inputs.level }}
          R1_29B: ${{ inputs.r1_29b }}
          FINALISTS: ${{ inputs.finalists }}
        run: |
          test -f "$ROUGE/configs/native/data-v1/manifest.json" || { echo "run task=data first"; exit 1; }
          if [ "$LEVEL" = "C" ] && [ -z "$FINALISTS" ]; then echo "level C needs finalists"; exit 1; fi
          read -r machine hours < <(python -c "import json; l=json.load(open('$ROUGE/configs/native/tournament-v1.json'))['levels']['$LEVEL']; print(l['machine'], l['max_hours'])")
          python "$ROUGE/lightning_ai/job.py" run --name "rouge-tournament-$LEVEL-${{ github.run_id }}" \
            --machine "$machine" --max-hours "$hours" --script lightning_ai/tournament.sh \
            --env "LEVEL=$LEVEL" --env "R1_29B=$R1_29B" --env "FINALISTS=$FINALISTS" \
            --results "$RUNNER_TEMP/runs.jsonl"
      - name: Score by the pre-registered rule
        if: ${{ always() }}
        working-directory: training/rouge
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          touch "$RUNNER_TEMP/runs.jsonl"
          if [ "$LEVEL" = "C" ] && [ -f results/tournament-v1/level-B/runs.jsonl ]; then
            cat results/tournament-v1/level-B/runs.jsonl "$RUNNER_TEMP/runs.jsonl" > "$RUNNER_TEMP/all.jsonl"
          else
            cp "$RUNNER_TEMP/runs.jsonl" "$RUNNER_TEMP/all.jsonl"
          fi
          python -m native.pareto --tournament configs/native/tournament-v1.json --runs "$RUNNER_TEMP/all.jsonl" \
            --level "$LEVEL" --out "$RUNNER_TEMP/decision.json" | tee "$RUNNER_TEMP/decision.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit runs, decision and ledger
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          LEVEL: ${{ inputs.level }}
        run: |
          cp "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          dest="$ROUGE/results/tournament-v1/level-$LEVEL"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$RUNNER_TEMP/ledger.json"
            mkdir -p "$dest"
            if [ -s "$RUNNER_TEMP/runs.jsonl" ]; then
              cp "$RUNNER_TEMP/runs.jsonl" "$dest/runs.jsonl"
              cp "$RUNNER_TEMP/decision.json" "$RUNNER_TEMP/decision.md" "$dest/" 2>/dev/null || true
            fi
            git add "$ROUGE/lightning_ai/ledger.json" "$dest"
            git diff --cached --quiet && break
            git commit -q -m "rouge(tournament): level $LEVEL runs and decision (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  dryrun-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'dryrun-cpu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install numpy tokenizers
      - name: Dry run (data, train, kill, resume, eval, registry, CRI, SFT)
        working-directory: training/rouge
        run: python -m native.dryrun --out "$RUNNER_TEMP/dry" --summary results/dry-run/cpu/summary.json
      - name: Commit the evidence
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          stash="$RUNNER_TEMP/stash"; mkdir -p "$stash"
          cp "$ROUGE/results/dry-run/cpu/summary.json" "$stash/summary.json"; cp "$ROUGE/results/cri/log.json" "$stash/cri-log.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            mkdir -p "$ROUGE/results/dry-run/cpu" "$ROUGE/results/cri"
            cp "$stash/summary.json" "$ROUGE/results/dry-run/cpu/summary.json"
            cp "$stash/cri-log.json" "$ROUGE/results/cri/log.json"
            git add "$ROUGE/results/dry-run/cpu" "$ROUGE/results/cri"
            git diff --cached --quiet && break
            git commit -q -m "rouge(dry-run): CPU pipeline evidence (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  dryrun-gpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'dryrun-gpu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Dry run on a Lightning GPU (free credits)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          MACHINE: ${{ inputs.machine }}
        run: |
          python "$ROUGE/lightning_ai/job.py" run --name "rouge-dryrun-${{ github.run_id }}" --machine "$MACHINE" --max-hours 0.5 \
            --script lightning_ai/dryrun.sh --prefix ROUGE_DRYRUN --results "$RUNNER_TEMP/dryrun.jsonl"
      - name: Commit the evidence and the ledger
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          stash="$RUNNER_TEMP/stash"; mkdir -p "$stash"
          cp "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
          if [ -s "$RUNNER_TEMP/dryrun.jsonl" ]; then
            tail -n 1 "$RUNNER_TEMP/dryrun.jsonl" | python3 -c "import json,sys; print(json.dumps(json.loads(sys.stdin.read()), indent=1))" > "$stash/summary.json"
          fi
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
            if [ -f "$stash/summary.json" ]; then mkdir -p "$ROUGE/results/dry-run/gpu" && cp "$stash/summary.json" "$ROUGE/results/dry-run/gpu/summary.json"; fi
            git add "$ROUGE/lightning_ai/ledger.json" "$ROUGE/results/dry-run" 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "rouge(dry-run): GPU pipeline evidence and ledger (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  ready:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install numpy tokenizers
      - name: TRAINING_READY gate (16 conditions, full test suite)
        working-directory: training/rouge
        run: python ready.py --run-tests | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Commit TRAINING_READY.json
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp "$ROUGE/TRAINING_READY.json" "$RUNNER_TEMP/ready.json"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/ready.json" "$ROUGE/TRAINING_READY.json"
            git add "$ROUGE/TRAINING_READY.json"
            git diff --cached --quiet && break
            git commit -q -m "rouge(ready): TRAINING_READY gate (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  tournament-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'tournament-cpu' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        candidate: [A, B, C, D, E]
    env:
      RUN_KEY: tournament-cpu-${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install numpy tokenizers datasets huggingface_hub
      - name: Corpus cache (keyed by the committed manifest)
        uses: actions/cache@v4
        with:
          path: ~/rouge-data
          key: rouge-native-data-v1-${{ hashFiles('training/rouge/configs/native/data-v1/manifest.json') }}
      - name: Corpus (verify the cache, or rebuild; every shard hash must match)
        working-directory: training/rouge
        run: |
          test -f configs/native/data-v1/manifest.json || { echo "run task=data first"; exit 1; }
          if ! python -m native.data.verify --data ~/rouge-data --manifest configs/native/data-v1/manifest.json; then
            rm -rf ~/rouge-data
            python -m native.data.build --out ~/rouge-data --tokenizer configs/native/data-v1/tokenizer.json \
              --expect configs/native/data-v1/manifest.json
          fi
      - name: Restore resume checkpoint (re-run of this job)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tournament
          key: ${{ env.RUN_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.RUN_KEY }}-${{ github.run_id }}-
      - name: Train and evaluate one candidate (stops with exit 75 at the budget)
        working-directory: training/rouge
        env:
          R1_29B: ${{ inputs.r1_29b }}
          CAND: ${{ matrix.candidate }}
        run: |
          python -m native.tournament run --tournament configs/native/tournament-v1.json --level B-cpu \
            --data ~/rouge-data --out "$RUNNER_TEMP/tournament" --r1-29b "$R1_29B" --only "$CAND:1" --budget-min 315
      - name: Save resume checkpoint
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tournament
          key: ${{ env.RUN_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: ${{ env.RUN_KEY }}
          path: ${{ runner.temp }}/tournament/runs.jsonl
          retention-days: 90

  tournament-cpu-score:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.task == 'tournament-cpu' }}
    needs: tournament-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tournament-cpu-*
          path: ${{ runner.temp }}/runs
      - name: Score by the pre-registered rule
        working-directory: training/rouge
        run: |
          cat "$RUNNER_TEMP"/runs/*/runs.jsonl > "$RUNNER_TEMP/all.jsonl" 2>/dev/null || touch "$RUNNER_TEMP/all.jsonl"
          python -m native.pareto --tournament configs/native/tournament-v1.json --runs "$RUNNER_TEMP/all.jsonl" \
            --level B-cpu --out "$RUNNER_TEMP/decision.json" | tee "$RUNNER_TEMP/decision.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit runs and decision
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          dest="$ROUGE/results/tournament-v1/level-B-cpu"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            mkdir -p "$dest"
            cp "$RUNNER_TEMP/all.jsonl" "$dest/runs.jsonl"
            cp "$RUNNER_TEMP/decision.json" "$RUNNER_TEMP/decision.md" "$dest/" 2>/dev/null || true
            git add "$dest"
            git diff --cached --quiet && break
            git commit -q -m "rouge(tournament): level B-cpu runs and decision (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done
