name: RI isolated experiments
on:
  push:
    branches: [ri/isolated-foundation]
    paths:
      - 'RI/**'
      - '.github/workflows/ri-validation.yml'
  pull_request:
    paths:
      - 'RI/**'
      - '.github/workflows/ri-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-evaluations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Python version
        run: python --version
      - name: Run M3–M7 experiments
        run: python RI/run_experiments.py
      - name: Upload raw experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri-experiment-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: RI/experiments/**/results/results.json
          if-no-files-found: warn
          retention-days: 30
