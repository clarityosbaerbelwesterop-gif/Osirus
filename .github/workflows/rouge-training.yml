name: Rouge training layer

# Rouge 1 training layer (training/rouge), no GPU, no weights, no secrets:
# - unit: base manifest, checkpoint manifests and promotion rules, dataset
#   registry (stdlib only), plus a metadata-only licence read of every
#   registered Hub dataset;
# - smoke: the real training path end to end on a tiny random model of the
#   base's architecture, with the pinned Qwen3.5-27B tokenizer and chat
#   template (hash-verified). The tiny model is not Rouge; it proves the
#   machinery: data -> template -> forward/backward -> LoRA -> checkpoint ->
#   resume -> merge -> reload -> inference -> evaluation.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - "training/rouge/**"
      - "models/rouge-1/**"
      - ".github/workflows/rouge-training.yml"
  pull_request:
    paths:
      - "training/rouge/**"
      - "models/rouge-1/**"
      - ".github/workflows/rouge-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s training/rouge/tests -v
      - name: Dataset licences (metadata only)
        run: python3 training/rouge/scripts/dataset_licenses.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install -r training/rouge/requirements-smoke.txt
      - name: Pinned Qwen3.5-27B tokenizer (sha256-verified)
        run: python training/rouge/scripts/fetch_tokenizer.py "$RUNNER_TEMP/qwen-tokenizer"
      - name: Pipeline tests
        working-directory: training/rouge
        run: python -m unittest discover -s tests -v
      - name: Smoke run (tiny model, real tokenizer)
        working-directory: training/rouge
        run: python -m rouge_train.smoke --workdir "$RUNNER_TEMP/smoke" --tokenizer "$RUNNER_TEMP/qwen-tokenizer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rouge-smoke-report
          path: |
            ${{ runner.temp }}/smoke/smoke-report.json
            ${{ runner.temp }}/smoke/run-straight/metrics.jsonl
            ${{ runner.temp }}/smoke/run-straight/train-report.json
          retention-days: 30
