name: Rouge research R1

# Rouge architecture research on free CI CPUs (research/rouge-architecture).
# R1.01: every model x seed trains on its own runner, then one job applies
# the pre-registered decision (experiments/r1_01.json). No paid compute.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths: [".github/workflows/research-r1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - run: python -m unittest discover -s research/rouge-architecture/tests -v

  r1_01:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: [transformer, transformer-flops, rouge, rouge-fixed]
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - name: Train and evaluate
        run: |
          nproc
          python research/rouge-architecture/experiments/r1_01.py train --model "${{ matrix.model }}" --seed "${{ matrix.seed }}" \
            --threads "$(nproc)" --out "$RUNNER_TEMP/r1.01"
      - uses: actions/upload-artifact@v4
        with:
          name: r1.01-${{ matrix.model }}-seed${{ matrix.seed }}
          path: ${{ runner.temp }}/r1.01
          retention-days: 90

  report:
    needs: r1_01
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: r1.01-*
          merge-multiple: true
          path: ${{ runner.temp }}/r1.01
      - name: Summary and pre-registered decision
        run: python research/rouge-architecture/experiments/r1_01.py report --out "$RUNNER_TEMP/r1.01"
      - uses: actions/upload-artifact@v4
        with:
          name: r1.01-summary
          path: |
            ${{ runner.temp }}/r1.01/summary.json
            ${{ runner.temp }}/r1.01/*-seed*.json
          retention-days: 90
