name: Rouge data

# Rouge 1 training data (training/rouge/datasets), built on a runner that
# can reach the Hugging Face Hub. Public data only, no secrets.
# - probe: licences, schemas and a short preview of candidate datasets;
# - build: the SFT mixture and the held-out eval set, with a manifest
#   (sha256, counts, sources, revisions), kept as an artifact.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - "training/rouge/datasets/**"
      - ".github/workflows/rouge-data.yml"
  workflow_dispatch:
    inputs:
      task:
        description: probe or build
        type: choice
        options: [probe, build]
        default: probe
      recipe:
        description: data recipe (datasets/build.py)
        type: choice
        options: [exp-001, sft-v0, rft-v1]
        default: exp-001

permissions:
  contents: write  # a build commits its manifest (hashes and counts only) to datasets/manifests/

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ inputs.task == 'build' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install datasets huggingface_hub tokenizers
      - name: Probe candidates
        if: ${{ github.event_name == 'push' || inputs.task == 'probe' }}
        run: python training/rouge/datasets/probe.py
      - name: Build SFT mixture and eval set
        if: ${{ inputs.task == 'build' }}
        env:
          RECIPE: ${{ inputs.recipe }}
        run: python training/rouge/datasets/build.py --recipe "$RECIPE" --out "$RUNNER_TEMP/rouge-data"
      - name: Store in the private Lightning model registry and commit the manifest
        if: ${{ inputs.task == 'build' && startsWith(github.ref_name, 'rouge/') }}
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          python -m pip install -q lightning-sdk
          name="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$RUNNER_TEMP/rouge-data/manifest.json")"
          mkdir -p "$RUNNER_TEMP/upload" && cp "$RUNNER_TEMP/rouge-data"/*.jsonl "$RUNNER_TEMP/rouge-data/manifest.json" "$RUNNER_TEMP/upload/"
          (cd training/rouge && python lightning_ai/storage.py upload "$RUNNER_TEMP/upload" "rouge/data/$name")
          cp "$RUNNER_TEMP/rouge-data/manifest.json" "training/rouge/datasets/manifests/$name.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "training/rouge/datasets/manifests/$name.json"
          git commit -m "rouge(data): $name built, stored in the Lightning model registry (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.task == 'build' }}
        with:
          name: rouge-${{ inputs.recipe }}-data
          path: ${{ runner.temp }}/rouge-data
          retention-days: 90
