name: Rouge edge

# Rouge Edge path on free CI hardware, end to end on the CI smoke model
# (a tiny random model of the base's architecture with the pinned
# Qwen3.5-27B tokenizer -- NOT Rouge):
#   merged checkpoint -> GGUF (llama.cpp, pinned commit) -> Q8_0 / Q6_K /
#   Q5_K_M / Q4_K_M -> size, speed, KL divergence vs F16, and the eval score
#   through llama-server's OpenAI-compatible endpoint.
# - linux: conversion, quantisation, CPU measurements; F16 must score like
#   the checkpoint itself (conversion correctness).
# - macos: the same GGUF files on Apple silicon with Metal, plus a Metal
#   build of the llama.cpp libraries for iOS (compile proof; no device).
# Real 27B numbers need the real weights; see docs/rouge/deployment.md.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - "training/rouge/rouge_train/edge.py"
      - "training/rouge/rouge_train/evaluate.py"
      - ".github/workflows/rouge-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp
  LLAMA_CPP_COMMIT: f1ea206218210afb913ae2f5d2c51faed35915da

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: llama.cpp at the pinned commit (CPU build)
        run: |
          git init -q "$RUNNER_TEMP/llama.cpp" && cd "$RUNNER_TEMP/llama.cpp"
          git fetch -q --depth 1 "$LLAMA_CPP_REPO" "$LLAMA_CPP_COMMIT" && git checkout -q FETCH_HEAD
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          cmake --build build -j4 --target llama-quantize llama-bench llama-perplexity llama-server
      - name: Install (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install -r training/rouge/requirements-smoke.txt
          python -m pip install "$RUNNER_TEMP/llama.cpp/gguf-py" sentencepiece
      - name: Pinned Qwen3.5-27B tokenizer (sha256-verified)
        run: python training/rouge/scripts/fetch_tokenizer.py "$RUNNER_TEMP/qwen-tokenizer"
      - name: Smoke checkpoint (tiny model, real tokenizer)
        working-directory: training/rouge
        run: python -m rouge_train.smoke --workdir "$RUNNER_TEMP/smoke" --tokenizer "$RUNNER_TEMP/qwen-tokenizer"
      - name: Edge pipeline (convert, quantise, measure)
        working-directory: training/rouge
        run: |
          python -m rouge_train.edge --model "$RUNNER_TEMP/smoke/rouge-1-sft-001-merged" --llama "$RUNNER_TEMP/llama.cpp" \
            --items "$RUNNER_TEMP/smoke/eval.jsonl" --out "$RUNNER_TEMP/edge" --max-new-tokens 12 --no-mtp --require-f16-match
      - uses: actions/upload-artifact@v4
        with:
          name: rouge-edge-smoke
          path: |
            ${{ runner.temp }}/edge/*.gguf
            ${{ runner.temp }}/edge/edge-report.json
            ${{ runner.temp }}/smoke/eval.jsonl
          retention-days: 14

  macos:
    needs: linux
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: rouge-edge-smoke
          path: ${{ runner.temp }}/artifact
      - name: llama.cpp at the pinned commit (Metal build)
        run: |
          git init -q "$RUNNER_TEMP/llama.cpp" && cd "$RUNNER_TEMP/llama.cpp"
          git fetch -q --depth 1 "$LLAMA_CPP_REPO" "$LLAMA_CPP_COMMIT" && git checkout -q FETCH_HEAD
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_METAL=ON
          cmake --build build -j3 --target llama-bench llama-perplexity llama-server
      - name: Install gguf reader
        run: python -m pip install "$RUNNER_TEMP/llama.cpp/gguf-py"
      - name: Measure on Apple silicon (Metal, all layers on the GPU)
        working-directory: training/rouge
        run: |
          mkdir -p "$RUNNER_TEMP/ggufs" && cp "$RUNNER_TEMP"/artifact/edge/*.gguf "$RUNNER_TEMP/ggufs/"
          python -m rouge_train.edge --model "$RUNNER_TEMP/ggufs" --llama "$RUNNER_TEMP/llama.cpp" \
            --items "$RUNNER_TEMP/artifact/smoke/eval.jsonl" --out "$RUNNER_TEMP/edge-metal" --max-new-tokens 12 --ngl 99
          python - <<'EOF'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          linux = json.load(open(f"{temp}/artifact/edge/edge-report.json"))
          metal = json.load(open(f"{temp}/edge-metal/edge-report.json"))
          expected = linux["checkpoint_score"]["score"]
          got = metal["variants"]["F16"]["score"]
          print(f"checkpoint {expected}, Metal F16 {got}")
          assert got == expected, "Metal F16 GGUF scores differently from the checkpoint"
          EOF
      - name: iOS build of the llama.cpp libraries (Metal, arm64, no signing)
        run: |
          cd "$RUNNER_TEMP/llama.cpp"
          cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build-ios --config Release --target llama -- -quiet
          find build-ios -name "libllama.a" -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: rouge-edge-metal
          path: ${{ runner.temp }}/edge-metal/edge-report.json
          retention-days: 14
