name: Sync runtime configuration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-runtime-configuration.yml
      - scripts/sync-vercel-runtime-env.mjs
      - scripts/lib/vercel-env.mjs
      - scripts/neon-sync.mjs
      - scripts/lib/neon.mjs
      - evals/top-models.probe.ts
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to synchronize
        required: true
        type: choice
        default: both
        options: [preview, production, both]
      model_policy:
        description: free-first (default; never needs paid credit) or configured-first
        required: true
        type: choice
        default: free-first
        options: [free-first, configured-first]
      primary_model:
        description: Optional exact model ID listed by /v1/models. Empty = verified free-model pool. A paid ID requires configured-first.
        required: false
        type: string
      rotate_auth_cookie_secret:
        description: Rotate the shared Neon Auth cookie secret (invalidates sessions)
        required: true
        type: boolean
        default: false
      migrate:
        description: Apply pending db/migrations to the Neon production database
        required: true
        type: boolean
        default: true
      redeploy:
        description: Redeploy production so the synced keys take effect
        required: true
        type: boolean
        default: true
      stripe:
        description: Set up and check Stripe (prices, webhook, portal, live signature)
        required: true
        type: boolean
        default: true
      public_production:
        description: Narrow Vercel Deployment Protection to previews when it blocks production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: osirus-runtime-configuration
  cancel-in-progress: false

jobs:
  sync:
    # Never expose deployment credentials to arbitrary pull-request code.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID != '' && vars.VERCEL_TEAM_ID || 'team_5KyyWAPW9vLU4EiaKaYZuhaG' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID != '' && vars.VERCEL_PROJECT_ID || 'prj_fuwXsDnXAfGE4fl4Offo0xBBnZP7' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
      UNOROUTER_API_KEY_1: ${{ secrets.UNOROUTER_API_KEY_1 }}
      UNOROUTER_API_KEY_2: ${{ secrets.UNOROUTER_API_KEY_2 }}
      UNOROUTER_API_KEY_3: ${{ secrets.UNOROUTER_API_KEY_3 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
      LIGHTNING_AI_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
      # Optional web search APIs for the Agents chat (Wikipedia without them).
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # Sign-ins that use every model without plan limits; a variable, not a secret.
      OSIRUS_OWNER_EMAILS: ${{ vars.OSIRUS_OWNER_EMAILS }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID != '' && vars.NEON_PROJECT_ID || 'super-voice-69875601' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
      STRIPE_PRICE_DEVELOPER: ${{ secrets.STRIPE_PRICE_DEVELOPER }}
      STRIPE_PRICE_ULTRA_100: ${{ secrets.STRIPE_PRICE_ULTRA_100 }}
      STRIPE_PRICE_ULTRA_200: ${{ secrets.STRIPE_PRICE_ULTRA_200 }}
      # M49: free-model-first. The old grok-4.6 default (and the repository
      # variable that pinned it) is gone: every role is rewritten to the
      # verified free pool unless a dispatch explicitly names a listed model.
      OSIRUS_MODEL_POLICY: ${{ inputs.model_policy || 'free-first' }}
      OSIRUS_PRIMARY_MODEL: ${{ inputs.primary_model || '' }}
      OSIRUS_SYNC_TARGET: ${{ inputs.target || 'both' }}
      # Preview values provisioned by the Vercel-Neon integration are pinned to a
      # git branch, so coverage has to be judged against the branch being synced.
      OSIRUS_SYNC_GIT_BRANCH: ${{ github.ref_name }}
      OSIRUS_ROTATE_AUTH_COOKIE_SECRET: ${{ inputs.rotate_auth_cookie_secret || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Neon (region, schema)
        # A report, not a gate: the key sync must run even if Neon's API is down.
        continue-on-error: true
        run: node scripts/neon-sync.mjs
      - name: Probe top-class models (real question per model)
        # Measures which strong models the keys can really use; the sync stores
        # the ones that answered correctly as OSIRUS_VERIFIED_TOP_MODELS. A
        # report, not a gate: without a result the ranking alone decides.
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_ENV: test
          PROBE_OUT: ${{ runner.temp }}/probe-top-models.json
        run: npx vitest run --config vitest.probe.config.ts --reporter=verbose
      - name: Synchronize GitHub runtime configuration to Vercel
        run: node scripts/sync-vercel-runtime-env.mjs
      - name: Pending migrations (dry run)
        if: env.DATABASE_URL != '' || env.NEON_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ env.DATABASE_URL || env.NEON_DATABASE_URL }}
        run: node scripts/apply-migrations.mjs --dry-run
      - name: Apply migrations
        if: github.event_name == 'workflow_dispatch' && inputs.migrate && (env.DATABASE_URL != '' || env.NEON_DATABASE_URL != '')
        env:
          DATABASE_URL: ${{ env.DATABASE_URL || env.NEON_DATABASE_URL }}
        run: node scripts/apply-migrations.mjs
      - name: Production reachable (Deployment Protection)
        continue-on-error: true
        env:
          OSIRUS_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || 'https://osirus-ai.vercel.app' }}
          OSIRUS_PUBLIC_PRODUCTION: ${{ inputs.public_production && 'true' || 'false' }}
        run: node scripts/vercel-protection.mjs
      - name: Stripe (account, prices, webhook, portal)
        # A report with fixes; a Stripe outage must not block the redeploy.
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.stripe && env.STRIPE_SECRET_KEY != ''
        env:
          OSIRUS_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || 'https://osirus-ai.vercel.app' }}
        run: node scripts/stripe-setup.mjs
      - name: Redeploy production
        # A push to main deploys through the Git integration already.
        if: github.event_name == 'workflow_dispatch' && inputs.redeploy && inputs.target != 'preview'
        run: node scripts/vercel-redeploy.mjs
