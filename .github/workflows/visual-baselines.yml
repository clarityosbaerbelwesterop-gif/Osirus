name: Visual baselines

# Renders the visual-regression baselines with the browser CI compares
# against, and commits them to the branch that asked for it. Runs only for a
# push to a branch other than main whose head commit message contains
# [update-visual-baselines]; review the committed images like any other change.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-visual-baselines]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=visual --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/__screenshots__
          retention-days: 14
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "test(e2e): visual baselines rendered by the CI browser"
          git push
