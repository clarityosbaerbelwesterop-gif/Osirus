name: Rouge train

# Rouge training on Lightning AI (owner directive 2026-09-30: Lightning for GPU training, storage and
# the model repository; RunPod is not used).
# - prepare: this runner builds the production corpus with the frozen tokenizer (free) and uploads it,
#   hash-manifested, to the private Lightning model registry; the manifest is committed.
# - train: one paid rung on one H100/H200 or a node of small GPUs (T4/L4/L40S, data parallel), on demand or
#   interruptible (preempted jobs relaunch and resume). Runs only in the protected environment "rouge-gpu": nothing
#   starts until the owner approves the run. Refused unless TRAINING_READY is true, the 50 EUR ceiling
#   holds with every Rouge job in the ledger, and the teamspace balance covers the worst case.
# - rouge1: one RSI iteration of Rouge 1 on the pinned base (owner decision 2026-09-30: Qwen3.6-27B):
#   download on the GPU machine, baseline eval, self-generated verified data, full-parameter training
#   (8 x H200), eval, pre-registered verdict. Same protected environment, ceiling and ledger.
# Weights stay in the private teamspace (drive + model registry); git gets hashes and numbers only.

on:
  # a push only registers the workflow (both jobs run on dispatch only)
  push:
    branches: ["rouge/native-model-*"]
    paths: [".github/workflows/rouge-train.yml"]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [prepare, prepare-parts, train, rouge1, teacher, program]
        default: prepare
      corpus:
        default: pretrain-v3
      tokens:
        description: "prepare: corpus size in tokens"
        default: "2.2e9"
      mixture:
        description: "prepare: mixture (v4: 41 code projects, up to 2 code epochs; decontamination rule v3)"
        default: v4
      rung:
        type: choice
        options: [100m, 300m, 600m, 2b-moe]
        default: 100m
      run:
        description: "train: lineage name, e.g. rouge-r1-100m-001"
        default: ""
      machine:
        description: "one large GPU, or a node of small GPUs trained data parallel (cheapest per TFLOP: results/lightning/probe.json)"
        type: choice
        options: [H100, H200, H200_X_4, H200_X_8, B200, B200_X_8, A100_40GB, A100_80GB, T4_X_4, T4_X_8, L4_X_4, L4_X_8, L40S, L40S_X_4]
        default: H100
      interruptible:
        description: "discounted interruptible capacity; a preempted job relaunches and resumes until the deadline"
        type: boolean
        default: false
      max_hours:
        description: "hard limit of the run, all attempts together (at most 5.75)"
        default: "3"
      optimizer:
        description: "train: adamw, or muon once its ablation has won"
        type: choice
        options: [adamw, muon]
        default: adamw
      fp8:
        description: "train: FP8 matmuls on H100/H200/B200, only after a loss-parity check"
        type: boolean
        default: false
      prereg:
        description: "rouge1: pre-registration (relative to training/rouge)"
        default: experiments/rouge-1-rl-001.json
      extra_data:
        description: "rouge1: verified teacher data to train on (registry paths, space separated), e.g. rouge/data/teacher-rouge-1-rl-001"
        default: ""
      teacher:
        description: "teacher: pinned teacher manifest; answers the hard prompts of the Rouge run named in 'run' (B200_X_8)"
        default: models/teachers/deepseek-v4-pro.json
      ttc_k:
        description: "rouge1: test-time compute check, k answers per primary item (0 = off; owner chose 8 on 2026-10-05, a few extra GPU minutes)"
        default: "8"

permissions:
  contents: read

concurrency:
  # paid training shares the tournament lock (one credit check at a time); a push only registers the
  # workflow, and prepare (worst case 2.4 credits) fits the balance next to a T4 tournament level
  # (worst case 1.35), so neither waits behind a level
  group: rouge-native-${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'train' || inputs.task == 'rouge1' || inputs.task == 'teacher' || inputs.task == 'program') && 'lightning' || format('train-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ROUGE: training/rouge

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy tokenizers datasets huggingface_hub lightning-sdk
      - name: Free runner disk for the corpus (about 5 GB of shards plus code archives)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the corpus on this runner (free) and store it in the Lightning model registry
        # A runner built the 400M-token tournament corpus in 7 minutes; a Lightning DATA_PREP machine
        # costs 1.48 USD/h (live price 2026-09-30), so the corpus is built here and only stored there.
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          ROUGE_CORPUS: ${{ inputs.corpus }}
          ROUGE_TOKENS: ${{ inputs.tokens }}
          ROUGE_MIXTURE: ${{ inputs.mixture }}
        working-directory: training/rouge
        run: |
          bash lightning_ai/prepare_job.sh 2>&1 | tee "$RUNNER_TEMP/prepare.log"
          grep '^ROUGE_PREPARE ' "$RUNNER_TEMP/prepare.log" | sed 's/^ROUGE_PREPARE //' > "$RUNNER_TEMP/prepare.jsonl"
      - name: Commit the manifest and the ledger
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          stash="$RUNNER_TEMP/stash"; mkdir -p "$stash"
          cp "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
          if [ -s "$RUNNER_TEMP/prepare.jsonl" ]; then
            tail -n 1 "$RUNNER_TEMP/prepare.jsonl" | python3 -c "import json,sys; print(json.dumps(json.loads(sys.stdin.read()), indent=1))" > "$stash/manifest.json"
          fi
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
            if [ -f "$stash/manifest.json" ]; then mkdir -p "$ROUGE/configs/native/$CORPUS" && cp "$stash/manifest.json" "$ROUGE/configs/native/$CORPUS/manifest.json"; fi
            git add "$ROUGE/lightning_ai/ledger.json" "$ROUGE/configs/native" 2>/dev/null || true
            git diff --cached --quiet && break
            if [ -f "$stash/manifest.json" ]; then msg="rouge(data): $CORPUS built, verified and stored in the Lightning model registry"; else msg="rouge(data): ledger of an unfinished $CORPUS build (no manifest)"; fi
            git commit -q -m "$msg (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  parts-val:
    # prepare-parts, step 1: validation splits of every source (the same stream prefix the part builds read),
    # so each part is decontaminated against the validation documents of all sources
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'prepare-parts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy tokenizers datasets huggingface_hub
      - name: Validation splits
        working-directory: training/rouge
        env:
          TOKENS: ${{ inputs.tokens }}
          MIXTURE: ${{ inputs.mixture }}
        run: |
          python -m native.data.build --out "$RUNNER_TEMP/val" --tokens "$TOKENS" --mixture "$MIXTURE" \
            --tokenizer configs/native/data-v1/tokenizer.json --val-out "$RUNNER_TEMP/val.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parts-val
          path: ${{ runner.temp }}/val.json
          retention-days: 7

  parts:
    # prepare-parts, step 2: one source per runner (free), stored as registry model rouge/data/<corpus>/<source>
    needs: parts-val
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        source: [web_en, web_de, wiki_en, wiki_de, code_py, math_web, finemath, math_synth, algo_synth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy tokenizers datasets huggingface_hub lightning-sdk
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/download-artifact@v4
        with:
          name: parts-val
          path: ${{ runner.temp }}/val
      - name: Build, verify and store one source
        working-directory: training/rouge
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          TOKENS: ${{ inputs.tokens }}
          MIXTURE: ${{ inputs.mixture }}
          CORPUS: ${{ inputs.corpus }}
          SRC: ${{ matrix.source }}
        run: |
          tokens="$(python -c "from native.data import sources; print($TOKENS * sources.MIXTURES['$MIXTURE']['$SRC'])")"
          python -m native.data.build --out /tmp/part --tokens "$tokens" --mixture "$MIXTURE" --only "$SRC" \
            --tokenizer configs/native/data-v1/tokenizer.json --eval-extra "$RUNNER_TEMP/val/val.json"
          python -m native.data.verify --data /tmp/part
          rm -rf /tmp/part/cache
          python lightning_ai/storage.py upload /tmp/part "rouge/data/$CORPUS/$SRC"
          cp /tmp/part/manifest.json "$RUNNER_TEMP/part-$SRC.json"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.source }}
          path: ${{ runner.temp }}/part-${{ matrix.source }}.json
          retention-days: 30

  parts-merge:
    # prepare-parts, step 3: one corpus manifest with the registry path of every part (committed)
    needs: parts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - name: Merge and commit the manifest
        if: ${{ startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          TOKENS: ${{ inputs.tokens }}
          MIXTURE: ${{ inputs.mixture }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          (cd "$ROUGE" && python -m native.data.merge --mixture "$MIXTURE" --total "$TOKENS" --corpus "$CORPUS" \
            --out "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP"/parts/*.json)
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            mkdir -p "$ROUGE/configs/native/$CORPUS" && cp "$RUNNER_TEMP/manifest.json" "$ROUGE/configs/native/$CORPUS/manifest.json"
            git add "$ROUGE/configs/native/$CORPUS"
            git diff --cached --quiet && break
            git commit -q -m "rouge(data): $CORPUS built one source per runner, stored in the Lightning model registry (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  train:
    # Paid: the owner approves every run of this job (protected environment).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'train' }}
    runs-on: ubuntu-latest
    environment: rouge-gpu
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Ceiling before launch
        run: python3 "$ROUGE/lightning_ai/cost.py" status
      - name: Train one rung on Lightning (stopped at the deadline by the launcher)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          RUNG: ${{ inputs.rung }}
          RUN: ${{ inputs.run }}
          MACHINE: ${{ inputs.machine }}
          MAX_HOURS: ${{ inputs.max_hours }}
          CORPUS: ${{ inputs.corpus }}
          INTERRUPTIBLE: ${{ inputs.interruptible }}
          OPTIMIZER: ${{ inputs.optimizer }}
          FP8: ${{ inputs.fp8 }}
        run: |
          test -n "$RUN" || { echo "run name required (rouge-r1-<rung>-<nnn>)"; exit 1; }
          python "$ROUGE/lightning_ai/train_session.py" --rung "$RUNG" --run "$RUN" --machine "$MACHINE" \
            --max-hours "$MAX_HOURS" --corpus "$CORPUS" --optimizer "$OPTIMIZER" \
            $([ "$INTERRUPTIBLE" = "true" ] && echo --interruptible) $([ "$FP8" = "true" ] && echo --fp8)
      - name: Commit the ledger and run records (hashes and numbers; no weights)
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ inputs.run }}
        run: |
          stash="$RUNNER_TEMP/stash"; mkdir -p "$stash"
          cp "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
          [ -d "$ROUGE/results/runs/$RUN" ] && cp -r "$ROUGE/results/runs/$RUN" "$stash/run"
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
            if [ -d "$stash/run" ]; then mkdir -p "$ROUGE/results/runs" && rm -rf "$ROUGE/results/runs/$RUN" && cp -r "$stash/run" "$ROUGE/results/runs/$RUN"; fi
            git add "$ROUGE/lightning_ai/ledger.json" "$ROUGE/results/runs" 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "rouge(train): ledger and records of $RUN (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done

  rouge1:
    # Paid: the owner approves every run of this job (protected environment).
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'rouge1' || inputs.task == 'teacher' || inputs.task == 'program') }}
    runs-on: ubuntu-latest
    environment: rouge-gpu
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lightning-sdk
      - name: Ceiling before launch
        run: python3 "$ROUGE/lightning_ai/cost.py" status
      - name: One RSI iteration of Rouge 1, or a teacher job, on Lightning (stopped at the deadline by the launcher)
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          TASK: ${{ inputs.task }}
          RUN: ${{ inputs.run }}
          PREREG: ${{ inputs.prereg }}
          EXTRA_DATA: ${{ inputs.extra_data }}
          TEACHER: ${{ inputs.teacher }}
          MACHINE: ${{ inputs.machine }}
          MAX_HOURS: ${{ inputs.max_hours }}
          TTC_K: ${{ inputs.ttc_k }}
        run: |
          cd "$ROUGE"
          if [ "$TASK" = program ]; then
            # every model line the planner admits (program/lines.json), in parallel, under one approval
            python program/launch.py
            exit $?
          fi
          test -n "$RUN" || { echo "run name required (rouge-1-rl-<nnn>)"; exit 1; }
          if [ "$TASK" = teacher ]; then
            python lightning_ai/rouge1_session.py --run "$RUN" --teacher "$TEACHER" --machine "$MACHINE" --max-hours "$MAX_HOURS"
          else
            python lightning_ai/rouge1_session.py --run "$RUN" --prereg "$PREREG" --machine "$MACHINE" --max-hours "$MAX_HOURS" \
              --extra-data "$EXTRA_DATA" --ttc-k "${TTC_K:-0}"
          fi
      - name: Commit the ledger and run records (hashes and numbers; no weights)
        if: ${{ always() && startsWith(github.ref_name, 'rouge/') }}
        env:
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ inputs.task == 'teacher' && format('{0}-teacher', inputs.run) || inputs.run }}
        run: |
          stash="$RUNNER_TEMP/stash"; mkdir -p "$stash"
          cp "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
          [ -d "$ROUGE/results/runs" ] && cp -r "$ROUGE/results/runs" "$stash/runs"   # every run of this job (program: several)
          git config user.name "rouge-research[bot]"
          git config user.email "rouge-research@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 "$ROUGE/lightning_ai/ledger_merge.py" "$ROUGE/lightning_ai/ledger.json" "$stash/ledger.json"
            if [ -d "$stash/runs" ]; then mkdir -p "$ROUGE/results/runs" && cp -r "$stash/runs/." "$ROUGE/results/runs/"; fi
            git add "$ROUGE/lightning_ai/ledger.json" "$ROUGE/results/runs" 2>/dev/null || true
            git diff --cached --quiet && break
            git commit -q -m "rouge(rouge1): ledger and records of ${RUN:-the program} (run ${{ github.run_id }})"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 5))
          done
