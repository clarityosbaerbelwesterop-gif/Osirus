name: Rouge evaluation

# Rouge 1 against its raw foundation core, on the same core, with
# substitution forbidden (M56 onward). It spends model calls, so it runs
# only when dispatched. The logs are public: the runner prints metadata
# (outcome, served model, tokens, latency), never prompts or answers.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: foundation = raw core vs Rouge; core-selection = tournament of candidate cores; kernel = raw vs Rouge p0 vs Rouge p1 (dev + holdout)
        required: true
        type: choice
        default: foundation
        options: [foundation, core-selection, kernel]
      core:
        description: (foundation, kernel) exact UnoRouter model ID of the core to evaluate
        required: false
        type: string
        default: grok-4.6
      candidates:
        description: (core-selection) comma-separated core IDs; empty = the default list
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: osirus-rouge-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Evaluate (metadata only)
        env:
          UNOROUTER_BASE_URL: https://api.unorouter.com/v1/chat/completions
          UNOROUTER_API_KEY_1: ${{ secrets.UNOROUTER_API_KEY_1 }}
          UNOROUTER_API_KEY_2: ${{ secrets.UNOROUTER_API_KEY_2 }}
          UNOROUTER_API_KEY_3: ${{ secrets.UNOROUTER_API_KEY_3 }}
          OSIRUS_RATE_LIMIT_MAX_WAIT_SECONDS: "60"
          ROUGE_EVAL_CORE: ${{ inputs.core }}
          ROUGE_CANDIDATES: ${{ inputs.candidates }}
          ROUGE_EVIDENCE: ${{ runner.temp }}/rouge-eval.json
          RSI_EVAL: ${{ inputs.mode == 'core-selection' && 'evals/rouge-core-selection.eval.ts' || inputs.mode == 'kernel' && 'evals/rouge-kernel.eval.ts' || 'evals/rouge-foundation.eval.ts' }}
        run: npx vitest run --config vitest.rsi.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rouge-eval
          path: ${{ runner.temp }}/rouge-eval.json
          if-no-files-found: ignore
          retention-days: 30
