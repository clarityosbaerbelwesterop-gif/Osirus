name: Rouge base-model manifest

# Pins Rouge 1's base model (M58): exact Hub revision, every file's size and
# sha256, the licence and the architecture config. Public metadata and small
# text files only -- never weights -- so it is safe on a public repository
# and needs no secrets. The manifest is printed and kept as an artifact; it
# is committed to training/rouge/manifests/ by hand after review.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Hugging Face model repository
        required: true
        type: string
        default: Qwen/Qwen3.5-397B-A17B
      revision:
        description: branch, tag or commit to pin
        required: true
        type: string
        default: main
      pin:
        description: write the result to models/rouge-1/base.json and commit it (rouge/* branches only)
        type: boolean
        default: false
      decision:
        description: owner decision recorded in the pinned manifest (with pin)
        type: string
        default: ""
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - .github/workflows/rouge-base-manifest.yml
      - training/rouge/scripts/base_manifest.py

permissions:
  contents: write  # only the pin step pushes, and only models/rouge-1/base.json

concurrency:
  group: rouge-base-manifest-${{ github.ref }}-${{ inputs.pin && 'pin' || github.run_id }}

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ inputs.pin == true }}
      - name: Build manifest (metadata only)
        env:
          REPO: ${{ inputs.repo || 'Qwen/Qwen3.5-397B-A17B' }}
          REVISION: ${{ inputs.revision || 'main' }}
        run: |
          python3 training/rouge/scripts/base_manifest.py "$REPO" "$REVISION" \
            > "$RUNNER_TEMP/base-manifest.json" 2> "$RUNNER_TEMP/README.md"
          echo "=== MANIFEST BEGIN ==="
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); m.pop('files'); print(json.dumps(m, indent=1))" "$RUNNER_TEMP/base-manifest.json"
          echo "=== FILES ==="
          python3 -c "import json,sys; [print(f['path'], f['size'], f['sha256'] or ('blob:'+str(f['gitBlob']))) for f in json.load(open(sys.argv[1]))['files']]" "$RUNNER_TEMP/base-manifest.json"
          echo "=== README ==="
          head -n 40 "$RUNNER_TEMP/README.md"
          echo "=== MANIFEST END ==="
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); c=m.get('config') or {}; t=c.get('text_config') or c; keys=('architectures','model_type','hidden_size','num_hidden_layers','n_routed_experts','num_experts','num_experts_per_tok','n_shared_experts','moe_intermediate_size','quantization_config','max_position_embeddings','vocab_size'); print('SUMMARY', json.dumps({'repo': m['repo'], 'revision': m['revision'], 'license': {k: m['license'][k] for k in ('cardLicense','licenseName','licenseLink')}, 'gated': m['gated'], 'weights': m['weights'], 'safetensorsTotal': m['safetensorsTotal'], 'byDtype': m['safetensorsParameters'], 'config': {k: (c.get(k) if c.get(k) is not None else t.get(k)) for k in keys}}))" "$RUNNER_TEMP/base-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rouge-base-manifest
          path: |
            ${{ runner.temp }}/base-manifest.json
            ${{ runner.temp }}/README.md
          retention-days: 90
      - name: Pin as Rouge 1 base and commit (metadata only, never weights)
        if: inputs.pin == true && startsWith(github.ref_name, 'rouge/')
        env:
          DECISION: ${{ inputs.decision }}
        run: |
          test -n "$DECISION" || { echo "decision is required with pin"; exit 1; }
          python3 training/rouge/scripts/pin_base.py "$RUNNER_TEMP/base-manifest.json" models/rouge-1/base.json \
            --run-id "$GITHUB_RUN_ID" --decision "$DECISION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/rouge-1/base.json
          git commit -m "rouge(base): pin $(python3 -c "import json; s=json.load(open('models/rouge-1/base.json'))['source']; print(s['repo']+'@'+s['revision'][:12])") as Rouge 1 base (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
