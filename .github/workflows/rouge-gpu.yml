name: Rouge GPU session

# One ephemeral GPU session for a pre-registered Rouge experiment, launched
# and watched from GitHub Actions (RunPod REST API):
#   probe: read RunPod's public API schema (no key, no cost);
#   run:   stage the dataset in the private Rouge model repository, rent ONE
#          pod, run training/rouge/scripts/gpu_session.sh on it, follow its
#          phases, and delete the pod on every exit path (success, failure,
#          cancel, time limit, price above the cap).
# Paid compute: the owner is asked before every run (cap 15 EUR per session;
# worst case = max_hours x max_price <= 15 USD is enforced). The run job uses
# the protected environment "rouge-gpu": with the owner as required reviewer
# nothing starts -- and no secret is readable -- until the owner approves
# the run in GitHub. Secrets RUNPOD_API_KEY, HF_TOKEN; variable
# ROUGE_HF_REPO (environment or repository level). Never printed.

on:
  # A push only probes the public API schema (no key, no cost).
  push:
    branches: ["rouge/native-model-*"]
    paths: [".github/workflows/rouge-gpu.yml"]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [probe, run]
        default: probe
      experiment:
        default: rouge-1-exp-001
      max_hours:
        description: hard wall-clock limit for the pod (hours)
        default: "4.5"
      max_price:
        description: highest accepted price per hour (USD)
        default: "3.30"
      cloud:
        type: choice
        options: [SECURE, COMMUNITY]
        default: SECURE

permissions:
  contents: read
  actions: read

concurrency:
  group: rouge-gpu
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name == 'push' || inputs.task == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: RunPod REST schema for pod creation (public)
        run: |
          curl -sSfL https://rest.runpod.io/v1/openapi.json -o openapi.json
          python3 - <<'EOF'
          import json
          spec = json.load(open("openapi.json"))
          print("paths:", sorted(spec.get("paths", {})))
          post = spec["paths"]["/pods"]["post"]
          body = post["requestBody"]["content"]["application/json"]["schema"]
          def resolve(schema):
              ref = schema.get("$ref")
              return resolve(spec["components"]["schemas"][ref.split("/")[-1]]) if ref else schema
          schema = resolve(body)
          for name, field in schema.get("properties", {}).items():
              field = resolve(field)
              enum = field.get("enum") or (field.get("items") or {}).get("enum")
              print(f"{name}: {field.get('type')} default={field.get('default')!r}" + (f" enum[:12]={enum[:12]}" if enum else ""))
          print("required:", schema.get("required"))
          EOF

  run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'run' }}
    runs-on: ubuntu-latest
    environment: rouge-gpu
    timeout-minutes: 350
    env:
      EXPERIMENT: ${{ inputs.experiment }}
      MAX_HOURS: ${{ inputs.max_hours }}
      MAX_PRICE: ${{ inputs.max_price }}
      CLOUD: ${{ inputs.cloud }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ROUGE_HF_REPO: ${{ vars.ROUGE_HF_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Required secrets and variable (names only)
        run: |
          missing=""
          [ -n "$RUNPOD_API_KEY" ] || missing="$missing RUNPOD_API_KEY(secret)"
          [ -n "$HF_TOKEN" ] || missing="$missing HF_TOKEN(secret)"
          [ -n "$ROUGE_HF_REPO" ] || missing="$missing ROUGE_HF_REPO(variable)"
          if [ -n "$missing" ]; then echo "missing:$missing"; exit 1; fi
          test -f "training/rouge/experiments/$EXPERIMENT.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q huggingface_hub hf_xet
      - name: Locate the built dataset
        id: data
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          exp = json.load(open(f"training/rouge/experiments/{os.environ['EXPERIMENT']}.json"))
          manifest = json.load(open(exp["data"]["manifest"]))
          print(f"name={manifest['name']}")
          print(f"artifact={manifest['build']['artifact']}")
          print(f"run_id={manifest['build']['run_id']}")
          print(f"manifest={exp['data']['manifest']}")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.data.outputs.artifact }}
          run-id: ${{ steps.data.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/data
      - name: Stage the dataset in the private Rouge repository (hash-checked)
        env:
          DATA_NAME: ${{ steps.data.outputs.name }}
          MANIFEST: ${{ steps.data.outputs.manifest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from huggingface_hub import HfApi
          manifest = json.load(open(os.environ["MANIFEST"]))
          folder = os.path.join(os.environ["RUNNER_TEMP"], "data")
          for part in ("train", "eval"):
              path = os.path.join(folder, manifest[part]["file"])
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assert digest == manifest[part]["sha256"], f"{part} differs from the committed manifest"
          api = HfApi()
          api.create_repo(os.environ["ROUGE_HF_REPO"], private=True, exist_ok=True)
          api.upload_folder(repo_id=os.environ["ROUGE_HF_REPO"], folder_path=folder, path_in_repo=f"data/{os.environ['DATA_NAME']}",
                            allow_patterns=["*.jsonl", "manifest.json"], commit_message=f"data: {os.environ['DATA_NAME']}")
          print("dataset staged, hashes match the committed manifest")
          PY
      - name: Rent one GPU pod
        run: |
          python3 training/rouge/scripts/runpod_session.py create --experiment "$EXPERIMENT" --state "$RUNNER_TEMP/pod.json" \
            --max-hours "$MAX_HOURS" --max-price "$MAX_PRICE" --cloud "$CLOUD"
      - name: Follow the session
        run: |
          python3 training/rouge/scripts/runpod_session.py watch --experiment "$EXPERIMENT" --state "$RUNNER_TEMP/pod.json" \
            --max-hours "$MAX_HOURS"
      - name: Delete the pod (always)
        if: ${{ always() }}
        run: python3 training/rouge/scripts/runpod_session.py delete --state "$RUNNER_TEMP/pod.json"
      - name: Result
        if: ${{ always() }}
        run: python3 training/rouge/scripts/runpod_session.py report --experiment "$EXPERIMENT"
