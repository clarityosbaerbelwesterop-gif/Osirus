name: Auth dependency bootstrap

on:
  push:
    branches:
      - build/m1-m5-production-gate

permissions:
  contents: write

jobs:
  dependency:
    if: ${{ !contains(github.event.head_commit.message || '', '[auth-dependency]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/m1-m5-production-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --save-exact @neondatabase/auth@latest
      - name: Commit exact auth dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Neon Managed Better Auth SDK [auth-dependency]"
          git push origin HEAD:build/m1-m5-production-gate
