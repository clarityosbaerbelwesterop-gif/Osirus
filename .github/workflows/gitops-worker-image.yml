name: GitOps worker image

# Builds the ephemeral worker image and pushes it to GHCR. Point the RunPod
# serverless endpoint at ghcr.io/<owner>/osirus-gitops-worker:<sha>.

on:
  push:
    branches: [main]
    paths: ["ai-lab/gitops/worker/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gitops-worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk for a CUDA-sized image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/osirus-gitops-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ai-lab/gitops/worker
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
