name: Rouge exo

# Rouge on exo (github.com/exo-explore/exo, Apache-2.0): a checkpoint of Rouge's architecture class
# (Qwen3_5ForConditionalGeneration) converted to MLX, served by exo from a read-only local directory
# (no hub download), placed through exo's API and scored by rouge_train.evaluate over the
# OpenAI-compatible endpoint. Free runner, Linux CPU backend (exo's MlxCpu): this proves the path,
# not speed. A real Qwen3.5-2B (8-bit) on this backend loaded and generated, but at about 0.07 tokens/s
# (run 36844724875), so throughput is measured on the owner's Macs (Metal backend, same steps).
# No secrets, no weights leave the runner.

on:
  push:
    branches: ["rouge/native-model-*"]
    paths:
      - ".github/workflows/rouge-exo.yml"
      - "training/rouge/serve/exo_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXO_REPO: https://github.com/exo-explore/exo
  EXO_COMMIT: 21a54c5ea0230a3bec1e1a786d200126c7e34ec6
  MODEL_ID: osirus/rouge-tiny-smoke

jobs:
  exo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tiny checkpoint of Rouge's architecture class (random weights; not Rouge)
        working-directory: training/rouge
        run: |
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install -q -r requirements-smoke.txt
          python - <<'EOF'
          from pathlib import Path
          from rouge_train import smoke
          out = Path("/tmp/rouge-tiny")
          tok = smoke.tiny_tokenizer(out)
          smoke.tiny_model(tok, out, seed=1, vocab_size=448)   # embedding rows divisible by the MLX quantisation group
          print(sorted(p.name for p in out.iterdir()))
          EOF
      - name: exo at the pinned commit (uv, Python 3.13, Rust nightly, MLX CPU backend)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          rustup toolchain install nightly --profile minimal
          git init -q "$RUNNER_TEMP/exo" && cd "$RUNNER_TEMP/exo"
          git fetch -q --depth 1 "$EXO_REPO" "$EXO_COMMIT" && git checkout -q FETCH_HEAD
          rustup override set nightly
          ~/.local/bin/uv sync --extra mlx-cpu
          # On Linux, exo's lock installs a CUDA build of an MLX fork (mlx 0.32.0 from rltakashige/mlx-jaccl-fix-small-recv)
          # next to PyPI's mlx-cpu 0.31.2; their native libraries do not link ("undefined symbol"). The official
          # pair from PyPI does (checked 2026-10-01: conversion and generation of Rouge's architecture class).
          ~/.local/bin/uv pip install --python .venv/bin/python --reinstall "mlx==0.32.0" "mlx-cpu==0.32.0"
          .venv/bin/python -c "import mlx.core as mx; print('mlx', mx.__version__, mx.default_device())"
          mkdir -p "$HOME/exo-dash" && echo '<html>rouge ci</html>' > "$HOME/exo-dash/index.html"
      - name: Convert the checkpoint to MLX (4-bit) and write its exo model card
        run: |
          EXO_PY="$RUNNER_TEMP/exo/.venv/bin/python"
          "$EXO_PY" training/rouge/serve/exo_runtime.py convert --hf /tmp/rouge-tiny --models-dir "$RUNNER_TEMP/exo-models" \
            --model-id "$MODEL_ID" --bits 4 --python "$EXO_PY"
          python training/rouge/serve/exo_runtime.py card --models-dir "$RUNNER_TEMP/exo-models" --model-id "$MODEL_ID" \
            --cards-dir "$HOME/exo-home/custom_model_cards" --quantization 4bit --base-model "Rouge CI smoke (tiny, random)"
          ls -la "$RUNNER_TEMP/exo-models"/*; cat "$HOME/exo-home/custom_model_cards/"*.toml
      - name: Start exo (offline, local weights only), place the checkpoint, chat, and score it with the Rouge harness
        env:
          EXO_HOME: exo-home
          EXO_DASHBOARD_DIR: exo-dash
        run: |
          cd "$RUNNER_TEMP/exo"
          EXO_OFFLINE=true EXO_MODELS_READ_ONLY_DIRS="$RUNNER_TEMP/exo-models" nohup .venv/bin/exo > "$RUNNER_TEMP/exo.log" 2>&1 &
          cd "$GITHUB_WORKSPACE/training/rouge"
          python serve/exo_runtime.py place --model-id "$MODEL_ID"
          reply="$(python serve/exo_runtime.py chat --model-id "$MODEL_ID" --prompt 'Who are you?')"
          echo "reply: ${reply:0:200}"
          python -m rouge_train.cli generate --backend openai --base-url http://127.0.0.1:52415/v1 --model "$MODEL_ID" \
            --items <(python -c "import json; from rouge_train import generators; [print(json.dumps(i)) for i in generators.eval_items('exo-ci', 3)]") \
            --out "$RUNNER_TEMP/exo-smoke.jsonl" --max-new-tokens 32
          python -c "import json,sys; rows=[json.loads(l) for l in open(sys.argv[1])]; assert len(rows) == 3, rows; print('scored', len(rows), 'items through exo')" "$RUNNER_TEMP/exo-smoke.jsonl"
      - name: exo log (tail)
        if: always()
        run: tail -n 80 "$RUNNER_TEMP/exo.log" || true
