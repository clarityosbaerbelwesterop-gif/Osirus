name: Security scan

# External checks of the production site, independent of our own tests:
# - Mozilla HTTP Observatory: grades transport and browser security headers
#   (CSP, HSTS, cookies, framing, referrer, MIME). The build fails below A.
# - OWASP ZAP baseline: spiders the public pages and runs ZAP's passive
#   rules only (no attack traffic). The build fails on any FAIL-level rule;
#   warnings are listed in the report.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

env:
  TARGET_HOST: osirus-ai.com

jobs:
  # Same scanner, same algorithm, run against the sites we measure ourselves
  # against. Informational: it never fails the build, it makes the
  # comparison reproducible instead of a claim.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Observatory comparison
        run: |
          set -uo pipefail
          echo "| Host | Grade | Score | Tests passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for host in "${TARGET_HOST}" openai.com chatgpt.com oracle.com cloud.oracle.com; do
            result=$(curl -fsS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${host}" || echo '{}')
            line=$(printf '%s' "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); print("| %s | %s | %s | %s/%s |" % (sys.argv[1], r.get("grade") or r.get("error") or "n/a", r.get("score","-"), r.get("tests_passed","-"), r.get("tests_quantity","-")))' "$host")
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            sleep 2
          done

  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mozilla HTTP Observatory
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${TARGET_HOST}" > observatory.json
          python3 - <<'PY'
          import json, sys
          with open("observatory.json") as handle:
              result = json.load(handle)
          print(json.dumps(result, indent=2))
          if result.get("error"):
              sys.exit("Observatory error: " + str(result["error"]))
          if result.get("grade") not in ("A+", "A"):
              sys.exit("Observatory grade below A: " + str(result.get("grade")))
          PY

  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: OWASP ZAP baseline (passive)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "https://${TARGET_HOST}" -m 3 \
            -J report.json -r report.html -I \
            || true
          python3 - <<'PY'
          import json, sys
          with open("zap/report.json") as handle:
              report = json.load(handle)
          alerts = [a for site in report.get("site", []) for a in site.get("alerts", [])]
          risk = {"3": "High", "2": "Medium", "1": "Low", "0": "Info"}
          for alert in sorted(alerts, key=lambda a: -int(a.get("riskcode", 0))):
              print(f"{risk.get(alert.get('riskcode'), '?'):6} {alert.get('pluginid'):>6} {alert.get('name')} ({alert.get('count')})")
          import datetime
          with open("security/zap-accepted.json") as handle:
              accepted = {e["pluginId"]: e for e in json.load(handle)["accepted"]}
          today = datetime.date.today().isoformat()
          blocking = []
          for alert in alerts:
              if alert.get("riskcode") not in ("3", "2"):
                  continue
              entry = accepted.get(str(alert.get("pluginid")))
              if not entry:
                  blocking.append(f"{alert.get('pluginid')} {alert.get('name')}")
              elif entry["expires"] < today:
                  blocking.append(f"{alert.get('pluginid')} accepted until {entry['expires']}, expired")
          if blocking:
              sys.exit("Blocking ZAP findings: " + "; ".join(blocking))
          print("No unaccepted medium or high findings.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline
          path: zap/
          retention-days: 30
