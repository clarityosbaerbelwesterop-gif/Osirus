name: GitOps pipeline

# Dispatches one job of the plan. Dry run by default (gate + payload preview).
#
# Triggers, all usable from an iPad:
#   - GitHub app or Actions tab: "Run workflow" (workflow_dispatch)
#   - REST, e.g. iOS Shortcuts / Working Copy / curl:
#       POST /repos/{owner}/{repo}/dispatches
#       {"event_type": "gitops-dispatch", "client_payload": {"job": "train:rouge-1", "execute": true}}
#
# Remote compute is released only when the manifest gate is clear AND a
# reviewer approves the `gpu-spend` environment. The runner only orchestrates:
# training, merging and evaluation run on the dedicated provider, and the
# worker reports back through gitops-record.

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job id from the plan, e.g. synth:golden-tokens, train:rouge-1, merge:darus-1
        required: true
        type: string
      execute:
        description: Send it (unchecked = dry run)
        type: boolean
        default: false
  repository_dispatch:
    types: [gitops-dispatch]

permissions:
  contents: read

concurrency:
  group: gitops-${{ inputs.job || github.event.client_payload.job }}
  cancel-in-progress: false

env:
  GITOPS_JOB: ${{ inputs.job || github.event.client_payload.job }}
  GITOPS_EXECUTE: ${{ inputs.execute == true || github.event.client_payload.execute == true || github.event.client_payload.execute == 'true' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      status: ${{ steps.plan.outputs.status }}
      execute: ${{ steps.plan.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: plan
        run: |
          echo "execute=$GITOPS_EXECUTE" >> "$GITHUB_OUTPUT"
          npx vite-node ai-lab/gitops/cli.ts dispatch "$GITOPS_JOB"

  synth:
    needs: gate
    if: needs.gate.outputs.stage == 'synth' && needs.gate.outputs.execute == 'true' && needs.gate.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: synthetic-data
    outputs:
      record: ${{ steps.record.outputs.record }}
    env:
      TEACHER_BASE_URL: ${{ secrets.TEACHER_BASE_URL }}
      TEACHER_API_KEY: ${{ secrets.TEACHER_API_KEY }}
      PRM_URL: ${{ secrets.PRM_URL }}
      PRM_API_KEY: ${{ secrets.PRM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - id: start
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          PIPELINE="${GITOPS_JOB#synth:}"
          echo "pipeline=$PIPELINE" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r .publish.hubRepo "ai-lab/gitops/pipelines/$PIPELINE.json")" >> "$GITHUB_OUTPUT"
          docker pull -q "$(jq -r .verification.sandbox.image "ai-lab/gitops/pipelines/$PIPELINE.json")"
      - id: swarm
        env:
          PIPELINE: ${{ steps.start.outputs.pipeline }}
        run: npx vite-node ai-lab/gitops/cli.ts synth "$PIPELINE" --out golden.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: golden-tokens
          path: golden.jsonl
          retention-days: 30
      - id: publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO: ${{ steps.start.outputs.repo }}
        run: |
          python -m pip install --quiet huggingface_hub==1.33.0
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          repo = os.environ["REPO"]
          api.create_repo(repo, repo_type="dataset", private=True, exist_ok=True)
          commit = api.upload_file(
              path_or_fileobj="golden.jsonl",
              path_in_repo="data/train.jsonl",
              repo_id=repo,
              repo_type="dataset",
              commit_message=f"golden tokens from run {os.environ['GITHUB_RUN_ID']}",
          )
          print(f"revision={commit.oid}")
          PY
      - id: record
        env:
          PIPELINE: ${{ steps.start.outputs.pipeline }}
          URI: hf://datasets/${{ steps.start.outputs.repo }}
          REVISION: ${{ steps.publish.outputs.revision }}
          ACCEPTED: ${{ steps.swarm.outputs.accepted }}
          TASKS: ${{ steps.swarm.outputs.tasks }}
          STARTED: ${{ steps.start.outputs.started }}
        run: >-
          npx vite-node ai-lab/gitops/cli.ts record-synth "$PIPELINE"
          --uri "$URI" --revision "$REVISION" --accepted "$ACCEPTED"
          --tasks "$TASKS" --started "$STARTED" --out synth-record.json

  record-synth:
    needs: synth
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/gitops-record.yml
    with:
      record: ${{ needs.synth.outputs.record }}

  dispatch:
    needs: gate
    if: contains(fromJSON('["train", "merge", "eval"]'), needs.gate.outputs.stage) && needs.gate.outputs.execute == 'true' && needs.gate.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gpu-spend
    env:
      OSIRUS_TRAINING_READY: ${{ vars.OSIRUS_TRAINING_READY }}
      RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MODAL_JOB_URL: ${{ secrets.MODAL_JOB_URL }}
      MODAL_JOB_TOKEN: ${{ secrets.MODAL_JOB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite-node ai-lab/gitops/cli.ts dispatch "$GITOPS_JOB" --execute
