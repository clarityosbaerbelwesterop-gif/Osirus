name: Apply Phase A patch

on:
  push:
    branches:
      - build/m1-m5-production-gate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/m1-m5-production-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct and verify patch archive
        run: |
          cat .phase-a/patch.b64.* | tr -d '\n' | base64 -d > /tmp/osirus-phase-a.tar.gz
          gzip -t /tmp/osirus-phase-a.tar.gz
          tar -tzf /tmp/osirus-phase-a.tar.gz >/tmp/osirus-phase-a-files.txt
          test -s /tmp/osirus-phase-a-files.txt
      - name: Apply Phase A implementation
        run: |
          tar -xzf /tmp/osirus-phase-a.tar.gz -C .
          rm -rf .phase-a
          rm -f .github/workflows/apply-phase-a.yml
          npm ci
          npx prettier --write .
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement durable authenticated M1-M5 runtime [phase-a-patch]"
          git push origin HEAD:build/m1-m5-production-gate
