name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Chromium and sympy before the unit tests: browser QA and the symbolic
      # compute provider are exercised for real there, not skipped.
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install --quiet sympy==1.14.0 numpy
      - run: npm test
      - run: npm run build
      # Smoke, visual regression, responsive, keyboard, accessibility and the
      # user journeys (see playwright.config.ts).
      - run: npm run test:e2e
      # The compared baselines, the HTML report and, on failure, the actual
      # and diff images and traces.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
            e2e/__screenshots__
          retention-days: 14
          if-no-files-found: ignore
