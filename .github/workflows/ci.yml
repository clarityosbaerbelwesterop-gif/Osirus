name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The software-RSI pipeline starts CI on its rsi/* draft branches: pull
  # requests opened with the workflow token do not trigger it on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      # Supply chain: no new high or critical advisory in production
      # dependencies (accepted ones: security/audit-allowlist.json).
      - run: node scripts/audit-gate.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Chromium and sympy before the unit tests: browser QA and the symbolic
      # compute provider are exercised for real there, not skipped.
      - run: scripts/install-playwright.sh
      - run: python -m pip install --quiet sympy==1.14.0 numpy
      - run: npm test
      - run: npm run build
      # Smoke, visual regression, responsive, keyboard, accessibility and the
      # user journeys (see playwright.config.ts).
      - run: npm run test:e2e
      # The compared baselines, the HTML report and, on failure, the actual
      # and diff images and traces.
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
            e2e/__screenshots__
          retention-days: 14
          if-no-files-found: ignore
