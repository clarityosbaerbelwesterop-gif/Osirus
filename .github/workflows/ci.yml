name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Chromium and sympy before the unit tests: browser QA and the symbolic
      # compute provider are exercised for real there, not skipped.
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install --quiet sympy==1.14.0 numpy
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
