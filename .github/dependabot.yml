# Security and version updates arrive as pull requests and pass the same CI
# (including scripts/audit-gate.mjs) as any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types must match the runtime (Node 24 on Vercel and in CI); newer
      # majors describe APIs production does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Each Stripe minor pins a newer API version, which changes webhook
      # and object shapes. That upgrade is a deliberate change, not a bump.
      - dependency-name: stripe
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      # Only its stylesheet is ours; rehype-katex renders with its own
      # KaTeX 0.16. A newer 0.x is a breaking release whose CSS would no
      # longer match the rendered formulas. Moves together with rehype-katex.
      - dependency-name: katex
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
