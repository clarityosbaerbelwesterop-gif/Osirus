name: RunPod fetch (CPU, nur lesen)

# Startet NUR, wenn sich gpu-job/FETCH auf dem Trainings-Branch aendert.
# CPU-Pod mit dem Network Volume, kein Training, keine Gewichte auf dem Runner.
# Box liest per ssh nur lesend von /vol; Pod wird spaetestens nach MAX_MINUTES geloescht.
on:
  push:
    branches: [claude/gitops-multi-model-finetuning-ort4m9]
    paths: [gpu-job/FETCH]

permissions:
  contents: read

concurrency:
  group: runpod
  cancel-in-progress: false

jobs:
  pod:
    runs-on: ubuntu-latest
    environment: RUNPOD
    timeout-minutes: 45 # Notbremse; Warten endet spaetestens 8 min davor
    env:
      BUDGET_CAP: "3.00" # feste Obergrenze pro Fetch in USD
      MAX_MINUTES: "30" # feste Obergrenze Laufzeit
      HARD_MAX_CPU_PRICE: "1.00" # USD/h, Pod mit hoeherem costPerHr wird sofort geloescht
      JOB_MAX_MIN: "45"
      CPU_FLAVOR: "cpu3c"
      VCPU: "2"
      IMAGE: "runpod/base@sha256:e6eb5a38bd3b321f41e7c584334c9ebc15e1e529574c7f2c866d148990cfb817"
      BRANCH: claude/gitops-multi-model-finetuning-ort4m9
      VOLUME_MOUNT: "/vol"
    steps:
      - name: Auftrag lesen (nur FETCH, kein Checkout)
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/contents/gpu-job/FETCH?ref=${{ github.sha }}" \
            -H "Accept: application/vnd.github.raw" > FETCH
          # FETCH: Z1 run_id, Z2 SSH-Key der Box, Z3 volume=<id>, Z4 dc=<id>, Z5 budget=N.NN
          RUN_ID=$(sed -n 1p FETCH); PUBKEY=$(sed -n 2p FETCH); V=$(sed -n 3p FETCH); D=$(sed -n 4p FETCH); B=$(sed -n 5p FETCH)
          [[ "$RUN_ID" =~ ^[a-z0-9-]{4,40}$ ]] || { echo "bad run_id"; exit 1; }
          [[ "$PUBKEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+(\ .*)?$ ]] || { echo "bad pubkey"; exit 1; }
          [[ "$V" =~ ^volume=([a-z0-9-]{3,40})$ ]] || { echo "bad volume"; exit 1; }; VOL="${BASH_REMATCH[1]}"
          [[ "$D" =~ ^dc=([A-Z0-9-]{1,16})$ ]] || { echo "bad dc"; exit 1; }; DC="${BASH_REMATCH[1]}"
          case "$DC" in EU-RO-1|US-NC-2) ;; *) echo "dc nicht in Allowlist"; exit 1 ;; esac
          [[ "$B" =~ ^budget=([0-9]\.[0-9]{2})$ ]] || { echo "bad budget"; exit 1; }; BUD="${BASH_REMATCH[1]}"
          python3 -c "import sys; sys.exit(0 if 0<float('$BUD')<=float('$BUDGET_CAP') else 1)" || { echo "budget ueber $BUDGET_CAP"; exit 1; }
          [ -z "$(sed -n '6,$p' FETCH | tr -d '[:space:]')" ] || { echo "FETCH hat zu viele Zeilen"; exit 1; }
          { echo "run_id=$RUN_ID"; echo "pubkey=$PUBKEY"; echo "volume=$VOL"; echo "dc=$DC"; echo "budget=$BUD"; } >> "$GITHUB_OUTPUT"
          echo "Fetch $RUN_ID, Volume in $DC, Budget $BUD USD, max $MAX_MINUTES min"

      - name: age installieren und Selbsttest (vor dem Pod)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age openssh-client >/dev/null
          ssh-keygen -q -t ed25519 -N "" -f t
          [ "$(printf ok | age -r "$(cat t.pub)" -a | age -d -i t)" = ok ] || { echo "age-Selbsttest fehlgeschlagen"; exit 1; }
          rm -f t t.pub

      - name: Volume pruefen
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VOL: ${{ steps.run.outputs.volume }}
          DC: ${{ steps.run.outputs.dc }}
        run: |
          set -euo pipefail
          vdc=$(curl -fsS "https://rest.runpod.io/v1/networkvolumes/$VOL" -H "Authorization: Bearer $RUNPOD_API_KEY" | jq -r '.dataCenterId // empty')
          [ "$vdc" = "$DC" ] || { echo "Volume liegt in '${vdc:-?}', FETCH verlangt $DC -> kein Pod angelegt"; exit 1; }
          echo "Volume ok in $DC"

      - name: CPU-Pod anlegen
        id: pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PUBKEY: ${{ steps.run.outputs.pubkey }}
          VOL: ${{ steps.run.outputs.volume }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg rid "$RUN_ID" --arg img "$IMAGE" --arg fl "$CPU_FLAVOR" --argjson vc "$VCPU" --arg pk "$PUBKEY" \
            --arg v "$VOL" --arg mp "$VOLUME_MOUNT" \
            '{name:("quasnir-fetch-"+$rid), imageName:$img, computeType:"CPU", cpuFlavorIds:[$fl], vcpuCount:$vc,
              cloudType:"SECURE", containerDiskInGb:20, networkVolumeId:$v, volumeMountPath:$mp,
              ports:["22/tcp"], supportPublicIp:true, interruptible:false, env:{PUBLIC_KEY:$pk, VOL_PATH:$mp}}')
          code=$(curl -sS -o /tmp/pod.json -w '%{http_code}' -X POST https://rest.runpod.io/v1/pods \
            -H "Authorization: Bearer $RUNPOD_API_KEY" -H "Content-Type: application/json" -d "$body") || code=000
          resp=$(cat /tmp/pod.json 2>/dev/null || true)
          if [ "${code:0:1}" != 2 ]; then
            echo "Pod anlegen: HTTP $code"
            { jq -c 'del(.env?, .publicIp?, .portMappings?)' <<<"$resp" 2>/dev/null || printf '%s' "$resp"; } | head -c 2000; echo
          fi
          id=$(jq -r .id <<<"$resp" || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"      # sofort, damit Cleanup immer greift
          price=$(jq -r '.costPerHr // empty' <<<"$resp")
          [ -n "$id" ] && [ "$id" != null ] || { echo "Pod-Start fehlgeschlagen"; exit 1; }
          echo "price=$price" >> "$GITHUB_OUTPUT"
          echo "Preis/h: $price"

      - name: Preis-Check und Limit berechnen
        id: limit
        env:
          PRICE: ${{ steps.pod.outputs.price }}
          RUN_BUDGET: ${{ steps.run.outputs.budget }}
        run: |
          set -euo pipefail
          [[ "$PRICE" =~ ^[0-9]{1,3}(\.[0-9]{1,12})?$ ]] || { echo "Preis fehlt/keine Zahl -> Abbruch"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          p=float(os.environ["PRICE"])
          if p<=0 or p>float(os.environ["HARD_MAX_CPU_PRICE"]): raise SystemExit(f"Preis {p}/h ueber Grenze")
          m=min(int(float(os.environ["RUN_BUDGET"])/p*60), int(os.environ["MAX_MINUTES"]))
          if m<=0: raise SystemExit("Budget reicht nicht")
          print(f"minutes={m}")
          PY
          tail -1 "$GITHUB_OUTPUT"

      - name: Endpunkt verschluesselt melden (eigener Schritt, endet sofort)
        timeout-minutes: 12
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD: ${{ steps.pod.outputs.id }}
          PUBKEY: ${{ steps.run.outputs.pubkey }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ep=$(curl -fsS "https://rest.runpod.io/v1/pods/$POD" -H "Authorization: Bearer $RUNPOD_API_KEY" \
                 | jq -r '(.publicIp // "") as $ip | (.portMappings["22"] // "" | tostring) as $p
                          | select(($ip|test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}$")) and ($p|test("^[0-9]{1,5}$"))) | "\($ip):\($p)"' || true)
            if [ -n "$ep" ]; then
              printf '%s' "$ep" | age -r "$PUBKEY" -a > endpoint.age
              exit 0
            fi
            sleep 30
          done
          echo "Kein Endpunkt nach 10 min -> Abbruch"; exit 1

      - name: Endpunkt als Artefakt (nur Chiffretext)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: endpoint-age
          path: endpoint.age
          if-no-files-found: error
          retention-days: 1

      - name: Warten auf DONE oder hartes Limit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          MINUTES: ${{ steps.limit.outputs.minutes }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD: ${{ steps.pod.outputs.id }}
        run: |
          set -euo pipefail
          end=$(( $(date +%s) + MINUTES*60 ))
          hard=$(( JOB_T0 + (JOB_MAX_MIN - 8)*60 ))
          if [ "$end" -gt "$hard" ]; then end=$hard; echo "Warten gekuerzt auf Joblimit - 8 min"; fi
          while [ "$(date +%s)" -lt "$end" ]; do
            d=$(gh api "repos/${{ github.repository }}/contents/gpu-job/DONE?ref=$BRANCH" \
                 -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
            [ "$d" = "$RUN_ID" ] && { echo "DONE erhalten"; exit 0; }
            c=$(curl -sS -o /dev/null -w '%{http_code}' "https://rest.runpod.io/v1/pods/$POD" -H "Authorization: Bearer $RUNPOD_API_KEY" || echo 000)
            [ "$c" = 404 ] && { echo "Pod existiert nicht mehr (Selbstloeschung)"; exit 0; }
            sleep 30
          done
          echo "Hartes Limit erreicht"

      - name: Pod loeschen (immer; nur /pods/<id>, nie Volumes)
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD: ${{ steps.pod.outputs.id }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          if [ -z "$POD" ]; then
            [ -n "$RUN_ID" ] || { echo "::error::keine RUN_ID - kein Namensabgleich, bitte manuell pruefen"; exit 1; }
            POD=$(curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" \
                  | jq -r --arg n "quasnir-fetch-$RUN_ID" '[.[] | select(.name==$n) | .id] | join(" ")' || true)
            [ -n "$POD" ] || { echo "kein Pod angelegt"; exit 0; }
          fi
          for P in $POD; do POD=$P
          for i in 1 2 3 4 5; do
            c=$(curl -sS -o /tmp/del.body -w '%{http_code}' -X DELETE "https://rest.runpod.io/v1/pods/$POD" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" || echo 000)
            case $c in 2*) echo "Pod geloescht (HTTP $c)"; continue 2;; 404) echo "Pod war schon weg"; continue 2;; esac
            echo "http=$c"; head -c 2000 /tmp/del.body; echo
            sleep 10
          done
          echo "::error::Pod $POD konnte nicht geloescht werden – sofort manuell stoppen"; exit 1
          done
